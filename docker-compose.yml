services:
  postgres:
    image: postgres:15-alpine
    container_name: ap2_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d default_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ap2_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ap2_payment_service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://user:password@postgres:5432/payment_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EXCHANGE: payment.events
      PAYMENT_ROUTING_KEY: payment.completed
      PAYMENT_QUEUE: payment.completed
      PAYMENT_DLX: payment.dlx
      PAYMENT_DLQ: payment.completed.dlq
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ap2_order_service
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://user:password@postgres:5432/order_db?sslmode=disable
      PAYMENT_SERVICE_URL: http://payment-service:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ap2_notification_service
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/notification_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EXCHANGE: payment.events
      PAYMENT_ROUTING_KEY: payment.completed
      PAYMENT_QUEUE: payment.completed
      PAYMENT_DLX: payment.dlx
      PAYMENT_DLQ: payment.completed.dlq
      MAX_RETRIES: "3"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
