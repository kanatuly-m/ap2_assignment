services:
  postgres:
    image: postgres:15-alpine
    container_name: ap2_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ap2_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ap2_rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ap2_payment_service
    env_file:
      - .env
    environment:
      PORT: ${PAYMENT_PORT}
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PAYMENT_EXCHANGE: ${PAYMENT_EXCHANGE}
      PAYMENT_ROUTING_KEY: ${PAYMENT_ROUTING_KEY}
      PAYMENT_QUEUE: ${PAYMENT_QUEUE}
      PAYMENT_DLX: ${PAYMENT_DLX}
      PAYMENT_DLQ: ${PAYMENT_DLQ}
    ports:
      - "${PAYMENT_PORT}:${PAYMENT_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ap2_order_service
    env_file:
      - .env
    environment:
      PORT: ${ORDER_PORT}
      DATABASE_URL: ${ORDER_DATABASE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      RATE_LIMIT: ${RATE_LIMIT}
      RATE_WINDOW_SECONDS: ${RATE_WINDOW_SECONDS}
    ports:
      - "${ORDER_PORT}:${ORDER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ap2_notification_service
    env_file:
      - .env
    environment:
      REDIS_ADDR: ${REDIS_ADDR}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PAYMENT_EXCHANGE: ${PAYMENT_EXCHANGE}
      PAYMENT_ROUTING_KEY: ${PAYMENT_ROUTING_KEY}
      PAYMENT_QUEUE: ${PAYMENT_QUEUE}
      PAYMENT_DLX: ${PAYMENT_DLX}
      PAYMENT_DLQ: ${PAYMENT_DLQ}
      MAX_RETRIES: ${MAX_RETRIES}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS}
      NOTIFICATION_STATUS_TTL_HOURS: ${NOTIFICATION_STATUS_TTL_HOURS}
      PROVIDER_MODE: ${PROVIDER_MODE}
      SIMULATED_LATENCY_MS: ${SIMULATED_LATENCY_MS}
      SIMULATED_FAILURE_RATE: ${SIMULATED_FAILURE_RATE}
      SIMULATED_ALWAYS_FAIL_EMAIL: ${SIMULATED_ALWAYS_FAIL_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
